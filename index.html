<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure PassGen | Random Password Generator</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fas fa-shield-alt"></i> Secure PassGen</h1>
            <p>Generate cryptographically strong random passwords</p>
        </header>

        <!-- Password Display Area -->
        <div class="password-display">
            <div id="passwordOutput" aria-label="Generated Password">Click Generate</div>
            <button class="copy-btn" id="copyBtn" title="Copy to Clipboard">
                <i class="fas fa-copy"></i>
            </button>
            <div class="copy-tooltip" id="copyTooltip">Copied!</div>
        </div>

        <!-- Controls Section -->
        <div class="controls">
            <!-- Length Slider -->
            <div class="length-slider">
                <label for="lengthRange">
                    <span>Password Length</span>
                    <span id="lengthValue">16</span>
                </label>
                <input type="range" id="lengthRange" min="4" max="64" value="16">
            </div>

            <!-- Options Checkboxes -->
            <div class="options-grid">
                <label class="option">
                    <input type="checkbox" id="includeUppercase" checked>
                    <span>Uppercase (A-Z)</span>
                </label>
                <label class="option">
                    <input type="checkbox" id="includeLowercase" checked>
                    <span>Lowercase (a-z)</span>
                </label>
                <label class="option">
                    <input type="checkbox" id="includeNumbers" checked>
                    <span>Numbers (0-9)</span>
                </label>
                <label class="option">
                    <input type="checkbox" id="includeSymbols" checked>
                    <span>Symbols (!@#)</span>
                </label>
            </div>
        </div>

        <!-- Strength Indicator -->
        <div class="strength-meter">
            <div class="strength-bar">
                <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-text" id="strengthText">Strength: Weak</div>
        </div>

        <!-- Generate Button -->
        <button class="generate-btn" id="generateBtn">
            <i class="fas fa-sync-alt"></i> Generate Password
        </button>

        <footer>
            <p>Built by <a href="https://github.com/niteshsingh-x" target="_blank">Nitesh Singh</a></p>
        </footer>
    </div>

    <!-- Main Script (Encapsulated) -->
    <script src="script.js"></script>
</body>
</html>
